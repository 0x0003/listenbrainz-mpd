[package]
name = "listenbrainz-mpd"
version = "2.5.1"
edition = "2024"
description = "ListenBrainz submission client for MPD"
license = "AGPL-3.0-only"
keywords = ["mpd", "listenbrainz", "musicbrainz", "scrobbling", "scrobbler"]
categories = ["command-line-utilities", "multimedia::audio"]
repository = "https://codeberg.org/elomatreb/listenbrainz-mpd"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enable native TLS for reqwest by default (would otherwise be disabled below).
default = ["reqwest/native-tls"]

# Generate shell completion files for certain shells
shell_completion = ["dep:clap_complete", "dep:clap"]

# Enable systemd-specific features (does nothing on non-Linux)
systemd = ["dep:sd-notify"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["cargo", "derive"] }
dirs = "6.0.0"
mpd_client = "1.4.1"
reqwest = { version = "0.13.4", features = [
    "json",
    "query",
], default-features = false }
rusqlite = "0.40.2"
sd-notify = { version = "0.5.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = [
    "rt",
    "net",
    "time",
    "macros",
    "signal",
    "sync",
] }
tokio-stream = "0.1.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
clap = { version = "4.6.6", features = ["cargo", "derive"], optional = true }
clap_complete = { version = "4.6.9", optional = true }
